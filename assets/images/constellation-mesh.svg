<svg width="500" height="400" viewBox="0 0 500 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="node-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mesh-ambient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ambient Glow Backdrop -->
  <circle cx="250" cy="200" r="180" fill="url(#mesh-ambient)"/>

  <!-- Constellation Mesh Connections -->
  <g stroke="#6366f1" stroke-opacity="0.35" stroke-width="1.2">
    <line x1="60" y1="120" x2="140" y2="60"/>
    <line x1="140" y1="60" x2="240" y2="100"/>
    <line x1="240" y1="100" x2="180" y2="200"/>
    <line x1="180" y1="200" x2="90" y2="180"/>
    <line x1="90" y1="180" x2="60" y2="120"/>
    <line x1="140" y1="60" x2="180" y2="200"/>

    <line x1="240" y1="100" x2="330" y2="50"/>
    <line x1="330" y1="50" x2="410" y2="120"/>
    <line x1="410" y1="120" x2="350" y2="210"/>
    <line x1="350" y1="210" x2="240" y2="100"/>
    <line x1="350" y1="210" x2="180" y2="200"/>

    <line x1="180" y1="200" x2="270" y2="300"/>
    <line x1="270" y1="300" x2="350" y2="210"/>
    <line x1="270" y1="300" x2="160" y2="320"/>
    <line x1="160" y1="320" x2="90" y2="180"/>
    <line x1="160" y1="320" x2="180" y2="200"/>

    <line x1="330" y1="50" x2="440" y2="70"/>
    <line x1="440" y1="70" x2="470" y2="160"/>
    <line x1="470" y1="160" x2="410" y2="120"/>
    <line x1="470" y1="160" x2="420" y2="270"/>
    <line x1="420" y1="270" x2="350" y2="210"/>

    <line x1="270" y1="300" x2="360" y2="350"/>
    <line x1="360" y1="350" x2="420" y2="270"/>

    <!-- Additional Interconnecting Cross Lines -->
    <line x1="60" y1="120" x2="180" y2="200" stroke-opacity="0.2"/>
    <line x1="140" y1="60" x2="330" y2="50" stroke-opacity="0.2"/>
    <line x1="240" y1="100" x2="270" y2="300" stroke-opacity="0.2"/>
    <line x1="350" y1="210" x2="470" y2="160" stroke-opacity="0.2"/>
  </g>

  <!-- Glowing Nodes with Outer Halos -->
  <g fill="#8b5cf6">
    <circle cx="60" cy="120" r="10" fill="url(#node-glow)"/>
    <circle cx="60" cy="120" r="4.5"/>

    <circle cx="140" cy="60" r="12" fill="url(#node-glow)"/>
    <circle cx="140" cy="60" r="5.5" fill="#6366f1"/>

    <circle cx="240" cy="100" r="16" fill="url(#node-glow)"/>
    <circle cx="240" cy="100" r="7" fill="#8b5cf6"/>

    <circle cx="180" cy="200" r="18" fill="url(#node-glow)"/>
    <circle cx="180" cy="200" r="8" fill="#6366f1"/>

    <circle cx="90" cy="180" r="11" fill="url(#node-glow)"/>
    <circle cx="90" cy="180" r="5"/>

    <circle cx="330" cy="50" r="13" fill="url(#node-glow)"/>
    <circle cx="330" cy="50" r="6" fill="#8b5cf6"/>

    <circle cx="410" cy="120" r="12" fill="url(#node-glow)"/>
    <circle cx="410" cy="120" r="5.5" fill="#6366f1"/>

    <circle cx="350" cy="210" r="16" fill="url(#node-glow)"/>
    <circle cx="350" cy="210" r="7.5" fill="#8b5cf6"/>

    <circle cx="270" cy="300" r="15" fill="url(#node-glow)"/>
    <circle cx="270" cy="300" r="6.5" fill="#6366f1"/>

    <circle cx="160" cy="320" r="10" fill="url(#node-glow)"/>
    <circle cx="160" cy="320" r="4.5"/>

    <circle cx="440" cy="70" r="9" fill="url(#node-glow)"/>
    <circle cx="440" cy="70" r="4"/>

    <circle cx="470" cy="160" r="11" fill="url(#node-glow)"/>
    <circle cx="470" cy="160" r="5" fill="#6366f1"/>

    <circle cx="420" cy="270" r="13" fill="url(#node-glow)"/>
    <circle cx="420" cy="270" r="5.5"/>

    <circle cx="360" cy="350" r="10" fill="url(#node-glow)"/>
    <circle cx="360" cy="350" r="4"/>
  </g>
</svg>
